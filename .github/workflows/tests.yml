name: Regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/run-node-tests.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/test-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser regression suite (mock chat)
        shell: bash
        run: |
          export CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          for test in steam-gif-picker/test/browser-*-regression.py; do
            echo "Running $test"
            python "$test" || exit 1
          done
